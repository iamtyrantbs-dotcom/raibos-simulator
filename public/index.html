<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raibos Simulator - Galactic Conquest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container"></div>
    <div id="particles"></div>

    <div id="app-container">
        <header class="header">
            <div class="title-area">
                <h1 class="title">Raibos Simulator</h1>
                <div id="rebirth-badge" class="rebirth-badge hidden">Rebirth: <span id="rebirth-count-disp">0</span></div>
            </div>
            
            <div class="stats">
                <div class="stat-box main-currency">
                    <span class="currency-label">Raibos</span>
                    <span id="raibos-count" class="currency-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Raibos / sec</span>
                    <span id="raibos-per-sec" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Raibos / click</span>
                    <span id="raibos-per-click" class="stat-value">1</span>
                </div>
                <div class="stat-box multiplier-box">
                    <span class="stat-label">Global Multiplier</span>
                    <span id="global-multiplier" class="stat-value highlight-value">x1.0</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="clicker-area">
                <div class="clicker-glow" id="clicker-glow"></div>
                <button id="raibos-button" class="raibos-btn">
                    <div class="raibos-face">R</div>
                </button>
            </section>

            <aside class="shop-area">
                <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 class="panel-title" style="margin: 0; border: none;">Control Center</h2>
                    <button id="hard-reset-btn" class="action-btn" style="background: rgba(255,0,0,0.1); border: 1px solid #ff3333; color: #ff3333; padding: 5px 12px; font-size: 0.8rem;">Hard Reset</button>
                </div>

                <div class="tabs">
                    <button class="tab active" data-tab="click-tab">Click</button>
                    <button class="tab" data-tab="idle-tab">Idle</button>
                    <button class="tab" data-tab="invasion-tab">Invasion</button>
                    <button class="tab" data-tab="artifact-tab">Artifacts</button>
                    <button class="tab" data-tab="ranking-tab">Ranking</button>
                    <button class="tab" data-tab="achievements-tab">Achievements</button>
                </div>

                <div id="click-tab" class="upgrade-list active">
                    <div id="click-upgrades"></div>
                </div>

                <div id="idle-tab" class="upgrade-list hidden">
                    <div id="idle-upgrades"></div>
                </div>

                <div id="invasion-tab" class="upgrade-list hidden">
                    <div id="invasion-planet-container"></div>
                    <div id="planet-nav" class="planet-navigation"></div>
                </div>

                <div id="artifact-tab" class="upgrade-list hidden">
                    <div class="artifact-header">
                        <div class="shard-count">Cosmic Shards: <span id="shard-amount">0</span></div>
                        <p class="artifact-hint">Rare drops on click (1/5000) or from conquest!</p>
                    </div>
                    <div id="artifact-container" class="artifact-grid"></div>
                </div>

                <div id="ranking-tab" class="upgrade-list hidden">
                    <div class="ranking-panel">
                        <div class="ranking-header-bar">
                            <select id="ranking-type" class="ranking-select">
                                <option value="totalRaibos">Total Raibos</option>
                                <option value="rebirthPoints">Rebirth Points</option>
                            </select>
                            <button id="refresh-ranking" class="refresh-btn">🔄</button>
                        </div>
                        <div id="ranking-list" class="ranking-container"></div>
                    </div>
                </div>

                <div id="achievements-tab" class="upgrade-list hidden">
                    <div id="achievements-container" class="achievements-grid"></div>
                </div>

                <div class="rebirth-footer" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                    <div id="rb-min-req" style="font-size: 0.85rem; color: #666; text-align: center; margin-bottom: 10px;">Reach 1B Raibos to unlock Rebirth</div>
                    <button id="rebirth-trigger-btn" class="action-btn" style="width: 100%;" onclick="rebirth()">REBIRTH</button>
                </div>
            </aside>
        </main>
    </div>

    <div id="offline-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Welcome Back!</h2>
            <p>During your absence for <span id="offline-time">0s</span></p>
            <p>Your Raibos worked hard:</p>
            <div class="offline-gain">+<span id="offline-amount">0</span> Raibos</div>
            <button id="offline-close-btn" class="action-btn">CLAIM</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
